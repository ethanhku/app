name: Release APK

# Push a tag like v0.1.0 (or run this manually) to publish a signed mossling.apk as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOSSLING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the MOSSLING_KEYSTORE_BASE64 and MOSSLING_KEY_PASSWORD repository secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mossling.p12"
          echo "MOSSLING_KEYSTORE=$RUNNER_TEMP/mossling.p12" >> "$GITHUB_ENV"
          echo "MOSSLING_VERSION_NAME=${VERSION#v}" >> "$GITHUB_ENV"
          echo "MOSSLING_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          MOSSLING_KEY_PASSWORD: ${{ secrets.MOSSLING_KEY_PASSWORD }}
        run: |
          ./gradlew :core:test :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk mossling.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          name: Mossling ${{ env.VERSION }}
          files: mossling.apk
          make_latest: true
          body: |
            Download **mossling.apk** below on your Android phone, open it, and allow "Install unknown apps" when asked.
            Then turn on Usage access for Mossling. Requires Android 8.0+.
